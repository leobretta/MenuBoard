<!DOCTYPE html>
<html>
<head>
    <title>{{ business or 'Menu' }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body.tv {
            background-color: {{ background }};
            color: {{ text_color }};
        }
        body.tv h2 {
            border-bottom-color: {{ text_color }};
        }
    </style>
</head>

<body class="tv">

<div id="board">

    {% if logo %}
        <img class="logo" src="{{ logo }}" style="height: {{ logo_height }}vh; max-height: none;"
             onerror="this.style.display='none'">
    {% elif business %}
        <div class="brand">{{ business }}</div>
    {% endif %}

    {% for section in sections %}
    <div class="section">
        <h2>{{ section.title }}</h2>

        {% for item in section["items"] %}
        <div class="item">
            <span>{{ item.name }}</span>
            <span class="price">${{ "%.2f"|format(item.price) }}</span>
        </div>
        {% endfor %}
    </div>
    {% endfor %}

</div>

<script>
    // Pick the largest text size where everything still fits on the screen.
    function fitBoard() {
        var board = document.getElementById("board");
        var low = 8, high = 120, best = low;

        while (high - low > 0.5) {
            var mid = (low + high) / 2;
            board.style.fontSize = mid + "px";
            if (document.documentElement.scrollHeight <= window.innerHeight) {
                best = mid;
                low = mid;
            } else {
                high = mid;
            }
        }
        board.style.fontSize = best + "px";
    }

    window.addEventListener("load", fitBoard);
    window.addEventListener("resize", fitBoard);

    // Reload every 30 seconds so menu edits show up on their own.
    setTimeout(function () { window.location.reload(); }, 30000);
</script>

</body>
</html>
