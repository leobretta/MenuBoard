<!DOCTYPE html>
<html>
<head>
    <title>{{ business or 'Menu' }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body.tv {
            background-color: {{ background }};
            color: {{ text_color }};
        }
        body.tv h2 {
            border-bottom-color: {{ text_color }};
        }
    </style>
</head>

<body class="tv">

<div id="board" data-columns="{{ columns }}">

    {% if logo %}
        <img class="logo" src="{{ logo }}" style="height: {{ logo_height }}vh; max-height: none;"
             onerror="this.style.display='none'">
    {% elif business %}
        <div class="brand">{{ business }}</div>
    {% endif %}

    <div id="columns">
    {% for section in sections %}
    <div class="section">
        <h2>{{ section.title }}</h2>

        {% for item in section["items"] %}
        <div class="item{% if item.sold_out %} sold-out{% endif %}">
            <span>{{ item.name }}</span>
            <span class="price">{% if item.sold_out %}SOLD OUT{% else %}${{ "%.2f"|format(item.price) }}{% endif %}</span>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
    </div>

</div>

<script>
    // Choose how many columns to use (1-3) and the text size, so the menu fills
    // the screen with the biggest text that still fits.
    function fitBoard() {
        var board = document.getElementById("board");
        var columns = document.getElementById("columns");
        var sectionCount = columns.children.length;
        var mode = board.getAttribute("data-columns") || "auto";

        var options = [];
        if (mode === "auto") {
            for (var n = 1; n <= Math.min(3, Math.max(1, sectionCount)); n++) options.push(n);
        } else {
            options.push(parseInt(mode, 10));
        }

        function fits() {
            var page = document.documentElement;
            return page.scrollHeight <= window.innerHeight &&
                   page.scrollWidth <= window.innerWidth;
        }

        // Biggest text size that fits with this many columns.
        function largestFontFor(count) {
            columns.style.columnCount = count;
            var low = 8, high = window.innerHeight / 9, best = low;
            while (high - low > 0.5) {
                var mid = (low + high) / 2;
                board.style.fontSize = mid + "px";
                if (fits()) { best = mid; low = mid; } else { high = mid; }
            }
            return best;
        }

        // Use more columns only when they make the text clearly (5%+) bigger.
        var bestCount = options[0];
        var bestSize = largestFontFor(bestCount);
        for (var i = 1; i < options.length; i++) {
            var size = largestFontFor(options[i]);
            if (size > bestSize * 1.05) { bestCount = options[i]; bestSize = size; }
        }

        columns.style.columnCount = bestCount;
        board.style.fontSize = bestSize + "px";
        board.setAttribute("data-fit-columns", bestCount);
        board.setAttribute("data-fit-font", bestSize.toFixed(1));
    }

    window.addEventListener("load", fitBoard);
    window.addEventListener("resize", fitBoard);

    // Reload every 30 seconds so menu edits show up on their own.
    setTimeout(function () { window.location.reload(); }, 30000);
</script>

</body>
</html>
