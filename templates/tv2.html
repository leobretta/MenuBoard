<!DOCTYPE html>
<html>
<head>
    <title>Dad's Subs - Sides & Drinks</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        // Auto-refresh the page every 30 seconds to pick up menu changes
        setTimeout(function() {
            window.location.reload();
        }, 10000);
    </script>

</head>

<body>

<img class="logo" src="{{ url_for('static', filename='images/logo.png') }}">

<h2>{{ menu.title }}</h2>


{% for item in menu["items"] %}

<div class="item">

    <span>
        {{ item.name }}
    </span>

    <span class="price">
        ${{ "%.2f"|format(item.price) }}
    </span>

</div>

{% endfor %}

</body>
</html>
